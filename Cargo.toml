[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.9.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/redrob-labs/redrob-launcher"

[workspace.lints.rust]
# `deny`, not `forbid`, so the one module that needs Win32 calls (the launcher's
# `snap_layouts.rs`) can `#![allow(unsafe_code)]`. No other code may.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
redrob-launcher-core = { path = "crates/core" }
redrob-launcher-ui-egui = { path = "crates/ui-egui" }
redrob-launcher-native = { path = "crates/native" }
redrob-login = { path = "crates/redrob-login" }
redrob-engine-client = { git = "https://github.com/redrob-labs/redrob-code", tag = "v0.6.3" }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false }
egui_kittest = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "debuginfo"
