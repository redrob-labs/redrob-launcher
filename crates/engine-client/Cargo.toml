[package]
name = "redrob-engine-client"
description = "Find, start, watch and stop the shared Redrob Code daemon from a Rust app: the record in ~/.redrob/run/server.json, its health, who is attached, and the engine's OpenAI-compatible base"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# Published from this repository so every Rust Redrob app (Shape, Canvas, Query, Recall, the
# launcher) reaches the one daemon the same way. See docs/engine.md.
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
dirs = "6"
base64 = "0.22"
# Plain HTTP to 127.0.0.1 only: the daemon never listens elsewhere, so no TLS is built in.
ureq = { version = "3.4", default-features = false }

[dev-dependencies]
tempfile = "3"
