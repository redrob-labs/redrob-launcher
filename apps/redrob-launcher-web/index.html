<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redrob Launcher</title>
  <link data-trunk rel="rust" data-bin="redrob-launcher-web" data-cargo-profile="wasm-release" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="icon" href="../../assets/app-icon/hicolor/64x64/apps/ai.redrob.launcher.png" />
  <link data-trunk rel="css" href="generated_tokens.css" />
  <style>
    /* Browser chrome follows the same appearance selected by the generated loading-page roles. */
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--surface-base); }
    #launcher_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* DS body-sm, sentence case, no tracking. */
    #launcher_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--ink-secondary); font: 400 13px/20px Pretendard, "Wanted Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="launcher_canvas"></canvas>
  <div id="launcher_loading">Loading Redrob Launcher&hellip;</div>
</body>
</html>
