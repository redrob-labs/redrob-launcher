# Release pipeline: a `vX.Y.Z` tag pushed on `main` builds installers for every platform and
# publishes the GitHub Release "Redrob Launcher vX.Y.Z" through the shared redrob-labs/.github
# release-publish workflow. Adapted from redrob-cad.
#
# The tag must equal the Cargo.toml version; the version job fails otherwise. The jobs that sign
# (macOS, Windows) and the publish job run in the `release` environment.
# Signing secrets are the redrob-labs organization's (Apple Developer ID certificate + App Store
# Connect API key for notarization; Azure Artifact Signing account IDs, reached over OpenID Connect,
# for Windows, used by the shared `actions/sign-windows` action). Every secret is optional: missing
# ones produce unsigned artifacts and a warning, never a failed build. A manual dispatch is a dry
# run: it builds and signs every job and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-notarization or mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  REDROB_LAUNCHER_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $v"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### Redrob Launcher v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS universal
    needs: version
    # Standard hosted runner: redrob-labs has no larger macOS runners configured, and a job that
    # names one waits in the queue forever.
    runs-on: macos-latest
    environment: release
    env:
      REDROB_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      REDROB_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-universal
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$REDROB_LAUNCHER_VERSION"
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: packaging/macos/package.sh --arch universal
      - name: Verify the disk image (signature, notarization ticket, archs)
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: packaging/macos/verify.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          # Windows on ARM: cross-compiled on the x64 runner (Rust and the setup's C++ alike), so
          # signing runs as above.
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      REDROB_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      REDROB_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      # Plain IDs (not credentials); here so the login step can be skipped when signing is not set up.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$REDROB_LAUNCHER_VERSION"
      # fontTools turns the design system's Pretendard woff2 into the TTF the setup embeds; without the
      # design system checkout (private) the setup falls back to Segoe UI Variable, which is fine.
      - name: Python for the setup build
        run: pip install fonttools
      - name: Build and stage
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -BuildOnly

      # Azure Artifact Signing, authenticated with OpenID Connect: the job's GitHub token is exchanged
      # for an Azure token against the organization's app registration, whose federated credential
      # accepts `repo:redrob-labs@<org id>/*:environment:release`. No client secret exists anywhere.
      # The login comes AFTER the build: GitHub's OIDC token lives minutes, and a login done before
      # a 12-minute build left signtool without a usable credential (it then waited on a browser).
      # The secrets below are redrob-labs organization secrets; do not recreate them as repository
      # secrets (a same-named repository secret would override them). All three are plain IDs.
      - name: Log in to Azure (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the executable
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: target/windows-package/${{ matrix.arch }}/*.exe
          description: Redrob Launcher
          url: https://github.com/redrob-labs/redrob-launcher
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      # The setup embeds the zip and its uninstaller, so each is signed before it goes in:
      # portable zip + uninstaller -> sign the uninstaller -> setup -> sign the setup.
      - name: Package (portable zip, uninstaller)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -SkipBuild

      - name: Sign the uninstaller
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: target/windows-package/${{ matrix.arch }}-setup/uninstall/*.exe
          description: Redrob Launcher Uninstaller
          url: https://github.com/redrob-labs/redrob-launcher
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - name: Package (setup)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -SetupOnly

      - name: Sign the setup
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: dist/release/*-setup.exe
          description: Redrob Launcher Setup
          url: https://github.com/redrob-labs/redrob-launcher
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - name: Check the packages
        shell: pwsh
        run: |
          Get-Item dist/release/redrob-launcher-*-windows-${{ matrix.arch }}-setup.exe
          Get-Item dist/release/redrob-launcher-*-windows-${{ matrix.arch }}-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest GitHub-hosted image, so the binaries only need glibc >= 2.35 (Ubuntu 22.04+,
    # Debian 12+, Fedora 36+, RHEL 10).
    runs-on: ${{ matrix.runner }}
    # No `environment: release`: this job signs nothing, so it gets no release secrets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      REDROB_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      REDROB_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream python3-yaml zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$REDROB_LAUNCHER_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/redrob-launcher$|metainfo|applications'
          ldd target/release/redrob-launcher
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            # Update information is embedded, and the .zsync for delta updates sits beside it.
            # Without APPIMAGE_EXTRACT_AND_RUN: with it, the runtime passes --appimage-* options
            # on to the app (which then tries to open a window) instead of answering them.
            "$appimage" --appimage-updateinformation | grep -F 'gh-releases-zsync|'
            test -s "$appimage.zsync"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  web:
    name: Web (wasm)
    needs: version
    runs-on: ubuntu-latest
    # No `environment: release`: this job signs nothing, so it gets no release secrets.
    env:
      REDROB_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      REDROB_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$REDROB_LAUNCHER_VERSION"
      - name: Build and zip
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [version, macos, windows, linux, web]
    # Only a version tag publishes; a manual dispatch stops before this job. Every platform must
    # succeed.
    # The publish itself (checksums, release create/refresh, publish as latest) is the shared
    # redrob-labs/.github workflow. No launcher manifest: that file tells the launcher an app reads
    # its shared sign-in, and this repository IS the launcher.
    if: >-
      always() && github.ref_type == 'tag' &&
      needs.version.result == 'success' && needs.macos.result == 'success' &&
      needs.windows.result == 'success' && needs.linux.result == 'success' &&
      needs.web.result == 'success'
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      title: Redrob Launcher
      launcher_manifest: false
      publish: true
