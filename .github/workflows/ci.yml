name: CI

# PR only: a push to develop/main is the merge of a PR that already passed this. A manual run
# (workflow_dispatch) also runs the Windows test leg and the full trunk web build.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A newer push to a PR branch cancels its older run. Runs on main are never cancelled, so every
# main state that gets a run is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only and version-only PRs skip the Rust jobs. A skipped job still satisfies a required
  # check, so `test (ubuntu-latest)` stays green for them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo heavy=true >>"$GITHUB_OUTPUT"
          else
            python3 scripts/ci_changes.py "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs run Linux only. Windows runs on a manual run; release.yml builds and checks macOS
        # and Windows before anything ships.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      # egui/winit/wgpu headers. The tray (ksni) and notifications (notify-rust over zbus) are
      # pure-Rust D-Bus clients, so no GTK, appindicator, xdo or libdbus packages are needed.
      - name: Install Linux system dependencies (egui/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The colours are the design system's: theme/generated.rs must match the newest
      # @redrob-labs/ui release (cargo xtask tokens writes it).
      - name: Design-system tokens are current
        if: runner.os == 'Linux'
        run: cargo xtask tokens --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  wasm:
    name: wasm32 check + trunk build
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - name: Check wasm-safe crates
        run: cargo xtask wasm
      - name: Clippy (wasm32)
        run: cargo clippy -p redrob-launcher-core -p redrob-launcher-web --target wasm32-unknown-unknown --locked -- -D warnings
      # The trunk build and zip is the slow half; PRs stop at the wasm32 clippy above.
      - name: Install trunk
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      # The same build and zip the release makes (size gate and relative-URL check included).
      - name: Build and zip the web app
        if: github.event_name == 'workflow_dispatch'
        run: packaging/web/package.sh
