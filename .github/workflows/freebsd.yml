# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners), then runs packaging/freebsd/package.sh and checks the tarball.
# Nothing is uploaded and no secrets are used. Inlined rather than calling upstream's reusable
# workflow, so nothing runs here from a repository this organisation does not control.
name: FreeBSD

# The VM build is slow, so it runs nightly rather than on every push. PRs that change the
# FreeBSD packaging still run it.
on:
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD 15 (build + test + package)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, test and package in a FreeBSD VM
        # vmactions/freebsd-vm v1.5.9, pinned by commit (it runs our build).
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          cpu: 4
          mem: 12288
          copyback: false
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -e
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            rustc --version
            export CARGO_TARGET_DIR=/var/tmp/redrob-launcher-target CARGO_BUILD_JOBS=4
            CARGO_PROFILE_DEV_DEBUG=0 cargo test --workspace --locked
            bash packaging/freebsd/package.sh
            tar -tzf dist/release/redrob-launcher-*-freebsd-x86_64.tar.gz \
              | grep -E '/bin/redrob-launcher$|/share/applications/ai\.redrob\.launcher\.desktop$'
