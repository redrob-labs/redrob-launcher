# Windows on ARM: package the ARM64 release (cross-compiled on an x64 runner, unsigned here), then
# install that per-user MSI on a Windows 11 ARM64 runner: once with the defaults (default folder,
# Start Menu and desktop shortcuts) and once into a chosen folder without the desktop shortcut,
# checking the binary is ARM64 and that each uninstall removes everything. The launcher is a GUI
# app, so it isn't run here. Inlined rather than calling upstream's reusable workflow, so nothing
# runs here from a repository this organisation does not control.
name: Windows ARM64

# Nightly (dependency and runner-image drift shows up within a day), and on PRs that change the
# Windows packaging itself.
on:
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: package (cross-compiled on x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-arm64-package
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\arm64
        run: ./packaging/windows/package.ps1 -Arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redrob-launcher-windows-arm64
          path: dist/arm64/*
          if-no-files-found: error
          retention-days: 7

  install:
    name: install and check on ARM64
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redrob-launcher-windows-arm64
          path: dist
      - name: Install the MSI, check it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'Redrob Launcher'
          $mainExeName = 'redrob-launcher.exe'
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $startLnk = Join-Path ([Environment]::GetFolderPath('Programs')) "$app.lnk"
          $deskLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "$app.lnk"
          $key = "HKCU:\Software\Redrob\$app"
          function Install([string[]] $props) {
            $p = Start-Process msiexec.exe -ArgumentList (@('/i', "`"$msi`"", '/qn', '/l*v', 'install.log') + $props) -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec /i exited $($p.ExitCode)" }
          }
          function Uninstall([string] $exe) {
            $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
            foreach ($left in $exe, $startLnk, $deskLnk) { if (Test-Path $left) { throw "uninstall left $left behind" } }
            if ((Get-ItemProperty $key -ErrorAction SilentlyContinue).InstallDir) { throw "uninstall left InstallDir in $key" }
            Write-Output 'ok uninstalled'
          }
          function Expect([bool] $ok, [string] $what) { if (-not $ok) { Get-Content install.log -Tail 60; throw $what }; Write-Output "ok $what" }

          Install @()
          $exe = Join-Path $env:LOCALAPPDATA "Programs\$app\$mainExeName"
          Expect (Test-Path $exe) "installed in default folder: $exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          Expect ($machine -eq 0xAA64) "the exe is ARM64 (machine 0x$('{0:X}' -f $machine))"
          Expect (Test-Path $startLnk) "Start Menu shortcut: $startLnk"
          Expect (Test-Path $deskLnk) "desktop shortcut: $deskLnk"
          Expect ([bool](Get-ItemProperty $key -ErrorAction SilentlyContinue).InstallDir) "install folder recorded in $key"
          Uninstall $exe

          $dir = Join-Path $env:LOCALAPPDATA "$app Test Folder"
          Install @("INSTALLFOLDER=`"$dir\`"", 'INSTALLDESKTOPSHORTCUT=0')
          $exe = Join-Path $dir $mainExeName
          Expect (Test-Path $exe) "installed in chosen folder: $exe"
          Expect (Test-Path $startLnk) "Start Menu shortcut: $startLnk"
          Expect (-not (Test-Path $deskLnk)) 'no desktop shortcut when not wanted'
          Uninstall $exe
          Expect (-not (Test-Path $dir)) 'uninstall removed chosen folder'
