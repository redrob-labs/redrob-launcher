  package:
    name: package (cross-compiled on x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-pc-windows-msvc, i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-arm64-package
      # Reuse this Rust-equipped x64 job: the installer matrix above compiles C++, not the launcher.
      - name: Check x86 Rust launcher
        if: github.event_name == 'pull_request'
        run: cargo check --locked -p redrob-launcher --target i686-pc-windows-msvc
      - name: Python for the setup build
        shell: pwsh
        run: |
          # ADDED-LINE-RATIONALE a6bbf89538a5e1b6:1: Supports `Python for the setup build` while preserving the nearby constraint: Pin via py -3, then bind package.ps1's `python` to that exact interpreter.
          # ADDED-LINE-RATIONALE 79c224fcd76ee292:1: Freezes `py` for `Python for the setup build` so every later calculation in this path observes the same input.
          # ADDED-LINE-RATIONALE 058a7bd6ccdd6455:1: Makes `Split / Path / python` an explicit part of `Python for the setup build` because the release automation exercises the same deterministic path on hosted runners.
          # Pin via py -3, then bind package.ps1's `python` to that exact interpreter.
          $python = py -3 -c "import sys; print(sys.executable)"
          py -3 -m pip install fontTools==4.67.0
          Split-Path $python | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\arm64
        run: ./packaging/windows/package.ps1 -Arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redrob-launcher-windows-arm64
          path: dist/arm64/*
          if-no-files-found: error
          retention-days: 7

  install:
    name: install and check on ARM64
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 30
