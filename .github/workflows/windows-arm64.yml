# Windows on ARM: package the ARM64 release (cross-compiled on an x64 runner, unsigned here), then
# install that per-user setup on a Windows 11 ARM64 runner with --silent, in English and in Korean,
# checking the binary is ARM64, the shortcuts, the recorded folder and language, the Settings > Apps
# entry, and that the uninstaller removes everything. The launcher is a GUI app, so it isn't run
# here; the setup is driven without its window. Inlined rather than calling upstream's reusable workflow, so nothing
# runs here from a repository this organisation does not control.
name: Windows ARM64

# Nightly (dependency and runner-image drift shows up within a day) and on a manual run. Not on
# PRs: the package + ARM64 install takes 5+ minutes on two Windows runners.
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: package (cross-compiled on x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-arm64-package
      - name: Python for the setup build
        run: pip install fonttools
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\arm64
        run: ./packaging/windows/package.ps1 -Arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redrob-launcher-windows-arm64
          path: dist/arm64/*
          if-no-files-found: error
          retention-days: 7

  install:
    name: install and check on ARM64
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redrob-launcher-windows-arm64
          path: dist
      - name: Install with the setup, check it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'Redrob Launcher'
          $mainExeName = 'redrob-launcher.exe'
          $setup = (Get-ChildItem dist/*-setup.exe | Select-Object -First 1).FullName
          $startLnk = Join-Path ([Environment]::GetFolderPath('Programs')) "$app.lnk"
          $deskLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "$app.lnk"
          $key = "HKCU:\Software\Redrob\$app"
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RedrobLauncher'
          $dir = Join-Path $env:LOCALAPPDATA "Programs\$app"
          $exe = Join-Path $dir $mainExeName
          $uninstaller = Join-Path $dir "Uninstall $app.exe"
          function Install([string[]] $flags) {
            $p = Start-Process $setup -ArgumentList (@('--silent') + $flags) -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "setup --silent exited $($p.ExitCode)" }
          }
          function Uninstall() {
            $p = Start-Process $uninstaller -ArgumentList '--uninstall', '--silent' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
            Start-Sleep -Seconds 5  # the uninstaller removes itself and its folder after it exits
            foreach ($left in $exe, $startLnk, $deskLnk, $dir) { if (Test-Path $left) { throw "uninstall left $left behind" } }
            if ((Get-ItemProperty $key -ErrorAction SilentlyContinue).InstallDir) { throw "uninstall left InstallDir in $key" }
            if (Test-Path $arp) { throw 'uninstall left the Settings > Apps entry' }
            Write-Output 'ok uninstalled'
          }
          function Expect([bool] $ok, [string] $what) { if (-not $ok) { throw $what }; Write-Output "ok $what" }

          Install @('--lang', 'en')
          Expect (Test-Path $exe) "installed in the default folder: $exe"
          Expect (-not (Test-Path (Join-Path $dir 'portable.txt'))) 'portable.txt was dropped'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          Expect ($machine -eq 0xAA64) "the exe is ARM64 (machine 0x$('{0:X}' -f $machine))"
          Expect (Test-Path $startLnk) "Start Menu shortcut: $startLnk"
          Expect (Test-Path $deskLnk) "desktop shortcut: $deskLnk"
          Expect (Test-Path $uninstaller) "uninstaller: $uninstaller"
          $rec = Get-ItemProperty $key
          Expect ($rec.InstallDir -eq $dir) "install folder recorded in $key"
          Expect ($rec.Language -eq 'en') 'language recorded: en'
          $entry = Get-ItemProperty $arp
          Expect ($entry.DisplayName -eq $app -and $entry.Publisher -eq 'Redrob') 'Settings > Apps entry'
          Uninstall

          Install @('--lang', 'ko')
          Expect (Test-Path $exe) "installed again: $exe"
          Expect ((Get-ItemProperty $key).Language -eq 'ko') 'language recorded: ko'
          Uninstall
