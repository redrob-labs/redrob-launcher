# Windows on ARM: package the ARM64 release (cross-compiled on an x64 runner, unsigned here), then
# install that per-user setup on a Windows 11 ARM64 runner with --silent, in English and in Korean,
# checking the binary is ARM64, the shortcuts, the recorded folder and language, the Settings > Apps
# entry, and that the uninstaller removes everything. The GUI launcher is not run here; PRs do
# cross-check its Windows bindings for i686, while the setup is driven without its window. Inlined
# rather than calling upstream's reusable workflow, so nothing runs here from a repository this
# organisation does not control.
name: Windows ARM64

# Nightly (dependency and runner-image drift shows up within a day), and on PRs that change the
# Windows packaging or the pointer-width-sensitive Snap Layout subclass.
on:
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - apps/redrob-launcher/src/snap_layouts.rs
      - packaging/windows/**
      - installer/windows/**
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  installer-ui:
    name: installer UI (${{ matrix.arch }})
    # Native x86/x64 PR runs catch SDK/compiler, rendering, and provider behavior before release packaging.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deterministic font subsetter
        # Use the same launcher as build.py; the exact pin keeps generated font tables reproducible.
        run: py -3 -m pip install fontTools==4.67.0
      - name: Compile setup with warnings as errors
        shell: pwsh
        run: |
          # ADDED-LINE-RATIONALE 43dabe73f3339268:1: Freezes `out` for `Compile setup with warnings as errors` so every later calculation in this path observes the same input.
          # ADDED-LINE-RATIONALE 33c6419176b45bda:1: Makes `py / installer / windows` an explicit part of `Compile setup with warnings as errors` because the release automation exercises the same deterministic path on hosted runners.
          # ADDED-LINE-RATIONALE da138e2641c17153:1: Supports `Compile setup with warnings as errors` while preserving the nearby constraint: A malformed embedded payload reaches the real worker-thread error path without installing anything.
          # ADDED-LINE-RATIONALE 0b430370417ffc57:1: Declares the `System / IO / File` contract on `System.IO.File` so the compiler or runner applies it before execution.
          # ADDED-LINE-RATIONALE 6058bf1e78306575:1: Delegates `System.IO.File`'s `py / installer / windows` work to `out` so existing state and error handling remain centralized.
          # ADDED-LINE-RATIONALE f6ec1c6694417f60:1: Delegates `System.IO.File`'s `version / payload / badPayload` work to `uninstaller` so existing state and error handling remain centralized.
          # ADDED-LINE-RATIONALE ae5dd6bf0b03b9a0:1: Makes `Redrob / Launcher / Error` an explicit part of `System.IO.File` because the release automation exercises the same deterministic path on hosted runners.
          $out = "target/installer-ui/${{ matrix.arch }}"
          py -3 installer/windows/build.py --out $out --arch ${{ matrix.arch }} --version 0.0.0
          # A malformed embedded payload reaches the real worker-thread error path without installing anything.
          $badPayload = Join-Path $out 'invalid-payload.zip'
          [System.IO.File]::WriteAllText($badPayload, 'not a zip archive')
          py -3 installer/windows/build.py --out (Join-Path $out 'error-fixture') --arch ${{ matrix.arch }} `
            --version 0.0.0 --payload $badPayload --uninstaller (Join-Path $out 'Redrob Launcher Setup.exe') `
            --name 'Redrob Launcher Error Fixture.exe'
      - name: Render and validate every stage
        shell: pwsh
        run: |
          # ADDED-LINE-RATIONALE cd66b76743325234:1: Freezes `ErrorActionPreference` for `Render and validate every stage` so every later calculation in this path observes the same input.
          # ADDED-LINE-RATIONALE 9f5dc85bec549520:1: Freezes `exe` for `Render and validate every stage` so every later calculation in this path observes the same input.
          # ADDED-LINE-RATIONALE daf37bc751076379:1: Freezes `render` for `Render and validate every stage` so every later calculation in this path observes the same input.
          # ADDED-LINE-RATIONALE 1e5afc8d8d6d5223:1: Makes `exe / render / stages` an explicit part of `Render and validate every stage` because the release automation exercises the same deterministic path on hosted runners.
          # ADDED-LINE-RATIONALE ebced81e01ae8349:1: Prevents `Render and validate every stage` from applying its side effect outside the `LASTEXITCODE / ne / throw` state.
          # ADDED-LINE-RATIONALE ba9bc8fef7f1af4b:1: Makes `Add / Type / AssemblyName` an explicit part of `Render and validate every stage` because the release automation exercises the same deterministic path on hosted runners.
          # ADDED-LINE-RATIONALE c93e6250c00c1920:1: Freezes `images` for `Render and validate every stage` so every later calculation in this path observes the same input.
          # ADDED-LINE-RATIONALE 110a8c65c870fad6:1: Prevents `Render and validate every stage` from applying its side effect outside the `images / Count / lt` state.
          # ADDED-LINE-RATIONALE 118823904964c7ad:1: Applies `Render and validate every stage` consistently to every `foreach / file / in` item rather than handling only the first match.
          # ADDED-LINE-RATIONALE 58cb16b83d9db29f:1: Freezes `image` for `Render and validate every stage` so every later calculation in this path observes the same input.
          # ADDED-LINE-RATIONALE 0921dd90c92352fc:1: Delegates `Render and validate every stage`'s `try / image / Width` work to `if` so existing state and error handling remain centralized.
          # ADDED-LINE-RATIONALE f3a9b44236cafcb8:1: Delegates `Render and validate every stage`'s `finally / image / Dispose` work to `image.Dispose` so existing state and error handling remain centralized.
          # ADDED-LINE-RATIONALE 521d49b4c0968cdb:1: Bounds the `Render and validate every stage` implementation here so `finally / image / Dispose` cannot leak into the adjacent declaration or control path.
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path "target/installer-ui/${{ matrix.arch }}/Redrob Launcher Setup.exe"
          $render = Join-Path $env:RUNNER_TEMP "installer-stages-${{ matrix.arch }}"
          & $exe --render-stages $render --theme light
          if ($LASTEXITCODE -ne 0) { throw "--render-stages exited $LASTEXITCODE" }
          Add-Type -AssemblyName System.Drawing
          $images = @(Get-ChildItem $render -Filter '*.png')
          if ($images.Count -lt 24) { throw "expected at least 24 stage images, found $($images.Count)" }
          foreach ($file in $images) {
            $image = [System.Drawing.Image]::FromFile($file.FullName)
            try { if ($image.Width -ne 1440 -or $image.Height -ne 880) { throw "bad dimensions for $($file.Name)" } }
            finally { $image.Dispose() }
          }
