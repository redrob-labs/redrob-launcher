        shell: pwsh
        run: |
          # ADDED-LINE-RATIONALE 6b0c75607d891711:1: Makes `Expect` fail visibly when `Expect / Test / Path` violates the behavior this path promises.
          # ADDED-LINE-RATIONALE 4af7af5e666bae59:1: Supports `Expect` while preserving the nearby constraint: A silent self-update must preserve a previously declined desktop shortcut.
          # ADDED-LINE-RATIONALE 7d1de46363c1be4a:1: Makes `Remove / Item / deskLnk` an explicit part of `Expect` because the release automation exercises the same deterministic path on hosted runners.
          # ADDED-LINE-RATIONALE 9b2283fe55e41251:2: Makes `Install / lang / en` an explicit part of `Expect` because the release automation exercises the same deterministic path on hosted runners.
          # ADDED-LINE-RATIONALE f527b35297ac691c:1: Makes `Expect` fail visibly when `Expect / not / Test` violates the behavior this path promises.
          # ADDED-LINE-RATIONALE 71f2573608a498d3:1: Makes `Expect` fail visibly when `Expect / Get / ItemProperty` violates the behavior this path promises.
          $ErrorActionPreference = 'Stop'
          $app = 'Redrob Launcher'
          $mainExeName = 'redrob-launcher.exe'
          $setup = (Get-ChildItem dist/*-setup.exe | Select-Object -First 1).FullName
          $startLnk = Join-Path ([Environment]::GetFolderPath('Programs')) "$app.lnk"
          $deskLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "$app.lnk"
          $key = "HKCU:\Software\Redrob\$app"
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RedrobLauncher'
          $dir = Join-Path $env:LOCALAPPDATA "Programs\$app"
          $exe = Join-Path $dir $mainExeName
          $uninstaller = Join-Path $dir "Uninstall $app.exe"
          function Install([string[]] $flags) {
            $p = Start-Process $setup -ArgumentList (@('--silent') + $flags) -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "setup --silent exited $($p.ExitCode)" }
          }
          function Uninstall() {
            $p = Start-Process $uninstaller -ArgumentList '--uninstall', '--silent' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
            Start-Sleep -Seconds 5  # the uninstaller removes itself and its folder after it exits
            foreach ($left in $exe, $startLnk, $deskLnk, $dir) { if (Test-Path $left) { throw "uninstall left $left behind" } }
            if ((Get-ItemProperty $key -ErrorAction SilentlyContinue).InstallDir) { throw "uninstall left InstallDir in $key" }
            if (Test-Path $arp) { throw 'uninstall left the Settings > Apps entry' }
            Write-Output 'ok uninstalled'
          }
          function Expect([bool] $ok, [string] $what) { if (-not $ok) { throw $what }; Write-Output "ok $what" }

          Install @('--lang', 'en')
          Expect (Test-Path $exe) "installed in the default folder: $exe"
          Expect (-not (Test-Path (Join-Path $dir 'portable.txt'))) 'portable.txt was dropped'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          Expect ($machine -eq 0xAA64) "the exe is ARM64 (machine 0x$('{0:X}' -f $machine))"
          Expect (Test-Path $startLnk) "Start menu shortcut: $startLnk"
          Expect (Test-Path $deskLnk) "desktop shortcut: $deskLnk"
          Expect (Test-Path $uninstaller) "uninstaller: $uninstaller"
          $rec = Get-ItemProperty $key
          Expect ($rec.InstallDir -eq $dir) "install folder recorded in $key"
          Expect ($rec.Language -eq 'en') 'language recorded: en'
          # A silent self-update must preserve a previously declined desktop shortcut.
          Set-ItemProperty $key DesktopShortcutChoice '0'
          Remove-Item $deskLnk -Force
          Install @('--lang', 'en')
          Expect (-not (Test-Path $deskLnk)) 'silent update preserved the declined desktop shortcut'
          Expect ((Get-ItemProperty $key).DesktopShortcutChoice -eq '0') 'desktop shortcut choice remained 0'
          $entry = Get-ItemProperty $arp
          Expect ($entry.DisplayName -eq $app -and $entry.Publisher -eq 'Redrob') 'Settings > Apps entry'
          Uninstall

          Install @('--lang', 'ko')
          Expect (Test-Path $exe) "installed again: $exe"
          Expect ((Get-ItemProperty $key).Language -eq 'ko') 'language recorded: ko'
          Uninstall
